<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%233182f6%22/%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22white%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%3E%3Crect%20x%3D%227%22%20y%3D%229%22%20width%3D%2218%22%20height%3D%2217%22%20rx%3D%223%22/%3E%3Cpath%20d%3D%22M11%206v6%20M21%206v6%20M7%2015h18%20m5%205%203%203%205-5%22/%3E%3C/g%3E%3C/svg%3E">
<title>데이트 플랜</title>
<style>/* 토스 디자인 시스템(TDS). 정본은 저장소 루트의 DESIGN.md.
   원문 토큰은 OKLCH지만 브라우저가 못 읽으면 색 선언이 통째로 버려져서 hex로 변환해 뒀다. */
:root {
  color-scheme: light;

  /* base — 회색은 전부 차가운 navy 계열이다. 순수 검정은 쓰지 않는다 */
  --white: #ffffff;
  --grey-50: #f6f8fa;
  --grey-100: #eef1f4;
  --grey-200: #dee3e7;
  --grey-300: #c5cbd2;
  --grey-400: #a7b0b9;
  --grey-500: #87919c;
  --grey-600: #6a7480;
  --grey-700: #4b5765;
  --grey-900: #141f2c;

  /* brand — 문서가 명시한 공식 hex. OKLCH 앵커를 변환하면 미묘하게 어긋난다 */
  --blue-500: #3182f6;
  --blue-600: #1065cc;
  --blue-50: #eaf5ff;

  --green-500: #007738;
  --orange-500: #ff8800;
  --red-500: #f03848;

  /* badge washed — 공식 토큰이 없어 base hue에서 명도만 올린 추정값이다 */
  --green-washed: #d7f6df;
  --orange-washed: #ffe8d2;

  --navy-900: #010a25;
  --fg-tertiary: rgba(1, 10, 37, .58);
  --line-subtle: rgba(0, 0, 0, .08);
  --press-overlay: rgba(0, 0, 0, .26);

  /* semantic — product 표면은 base가 아니라 이쪽 이름으로 부른다 */
  --fill-brand: var(--blue-500);
  --fill-secondary: var(--grey-100);
  --fill-weak: var(--grey-50);
  --text-primary: var(--grey-900);
  --text-secondary: var(--grey-700);
  --text-tertiary: var(--fg-tertiary);
  --text-alt: var(--white);
  --text-brand: var(--blue-500);
  --bg-primary: var(--white);
  --line-default: var(--grey-200);

  /* rounded ladder */
  --r-xs: 4px; --r-s: 8px; --r-m: 12px; --r-l: 14px;
  --r-xl: 16px; --r-2xl: 20px; --r-3xl: 24px; --r-full: 999px;

  /* elevation — 평면이 기본이고 떠 있는 표면에만 쓴다 */
  --shadow-1: 0 1px 2px rgba(1, 10, 37, .04), 0 1px 1px rgba(1, 10, 37, .04);
  --shadow-2: 0 4px 12px rgba(1, 10, 37, .06), 0 1px 2px rgba(1, 10, 37, .04);

  /* motion — 이 셋 밖으로 나가지 않는다 */
  --ease: cubic-bezier(.22, .61, .36, 1);
  --dur-fast: 120ms;
  --dur-base: 200ms;

  /* TPS는 재배포가 막혀 있어 Pretendard가 1순위 대체다. 웹폰트는 받지 않는다 */
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
          "SF Pro Text", "SF Pro", "Apple SD Gothic Neo", "Noto Sans KR", Roboto,
          "Helvetica Neue", Arial, sans-serif;

  /* 화면 좌우 여백. 원문 룰 오브 섬은 24px인데 시각 칼럼까지 들어가면 폰에서 좁다 */
  --gutter: 20px;
}

* { box-sizing: border-box; }

body {
  margin: 0; padding: 0 0 64px;
  background: var(--bg-primary); color: var(--text-primary);
  /* body-2 — 한글 가독성 때문에 1.5가 표준이다 */
  font: 400 15px/1.5 var(--font);
  letter-spacing: -.005em;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}

/* 모바일 단일 컬럼. 태블릿·데스크톱에서도 컬럼을 늘리지 않는다 */
.top, .day, .places, .plans, .tabs, .empty, details.past {
  max-width: 38rem; margin-left: auto; margin-right: auto;
  padding-left: var(--gutter); padding-right: var(--gutter);
}

a { color: inherit; text-decoration: none; }
h1, h2, h3 { word-break: keep-all; overflow-wrap: anywhere; margin: 0; color: var(--text-primary); font-weight: 700; }
:focus-visible { outline: 2px solid var(--fill-brand); outline-offset: 2px; border-radius: var(--r-s); }
::selection { background: var(--blue-50); color: var(--text-primary); }

/* ── 머리말 ─────────────────────────────────────────── */
.top { padding-top: 32px; padding-bottom: 16px; }
/* h1 — 28/700/-2% */
.top h1 { font-size: 1.75rem; line-height: 1.3; letter-spacing: -.02em; }

/* top-app-bar 자리의 뒤로가기. button-secondary S */
.back {
  display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px;
  margin-bottom: 24px; border-radius: var(--r-m);
  background: var(--fill-secondary); color: var(--text-secondary);
  font-size: .8125rem; font-weight: 600; letter-spacing: 0;
  transition: background var(--dur-fast) var(--ease);
}
.back:active { background: var(--grey-200); }

/* body-2 보조 텍스트 */
.range { margin: 6px 0 0; color: var(--text-secondary); font-size: .9375rem; }

/* badge — 22px, 6px radius, washed 배경 + 시맨틱 텍스트 */
.checked {
  display: inline-flex; align-items: center; min-height: 22px;
  margin: 14px 0 0; padding: 2px 8px; border-radius: 6px;
  font-size: .75rem; font-weight: 500; line-height: 1.4; letter-spacing: 0;
}
.checked.ok { background: var(--green-washed); color: var(--green-500); }
.checked.todo { background: var(--orange-washed); color: #b35f00; }
.empty { color: var(--text-secondary); }

/* ── 플랜 목록 (list-row) ───────────────────────────── */
.plans { margin-top: 16px; margin-bottom: 0; padding-top: 0; list-style: none; }
.plans li { position: relative; border-radius: var(--r-2xl); background: var(--fill-weak); }
.plans li + li { margin-top: 12px; }
.plans a {
  display: block; padding: 24px 44px 24px 20px; border-radius: var(--r-2xl);
  transition: background var(--dur-fast) var(--ease);
}
.plan-arrow { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary); }
.plans a:active { background: var(--fill-secondary); }
/* title-1 18/600 */
.plans .t {
  display: block; overflow-wrap: anywhere; word-break: keep-all;
  font-size: 1.125rem; font-weight: 600; line-height: 1.45; letter-spacing: -.01em;
}
/* body-3 13/400 */
.plans .d {
  display: block; margin-top: 8px; color: var(--text-secondary);
  font-size: .8125rem; letter-spacing: 0;
}
.plans .checked { margin: 0 0 8px; }

/* 오늘 걸린 플랜 — brand-weak 행. 이 화면의 유일한 강조다 */
.plans li.now { background: var(--blue-50); }
.plans li.now a:active { background: #dcedff; }
.plans li.now .t { color: var(--text-brand); }
.plans li.now .t::before {
  content: "오늘"; display: inline-block; margin-right: 6px; padding: 2px 7px;
  border-radius: 6px; background: var(--fill-brand); color: var(--text-alt);
  font-size: .6875rem; font-weight: 600; letter-spacing: 0; vertical-align: 2px;
}
.plans li.now .checked { background: var(--white); }

/* list-footer 성격의 더보기 행 */
details.past { margin-top: 28px; }
details.past summary {
  display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px;
  border-radius: var(--r-m); background: var(--fill-secondary);
  color: var(--text-secondary); font-size: .9375rem; font-weight: 600;
  letter-spacing: -.005em; cursor: pointer; list-style: none;
}
details.past summary::after { content: "+"; margin-left: 12px; }
details.past[open] summary::after { content: "−"; }
details.past summary::-webkit-details-marker { display: none; }
details.past summary:active { background: var(--grey-200); }
details.past .plans { margin-top: 10px; padding-left: 0; padding-right: 0; }

/* ── 날짜 선택 (segmented-control) ──────────────────── */
.tabs {
  display: flex; gap: 4px; overflow-x: auto; position: sticky; top: 0; z-index: 5;
  margin-top: 20px; padding-top: 16px; padding-bottom: 16px;
  background: var(--bg-primary);
}
.tabs::before {
  content: ""; position: absolute; inset: 12px var(--gutter);
  border-radius: var(--r-m); background: var(--fill-secondary);
}
.tabs button {
  position: relative; flex: 1 0 auto; min-width: 88px; min-height: 44px; padding: 0 12px;
  border: 0; border-radius: var(--r-s); background: transparent;
  color: var(--text-secondary);
  font: 600 .8125rem/1.25 var(--font); letter-spacing: 0;
  white-space: nowrap; cursor: pointer;
  transition: background var(--dur-base) var(--ease), color var(--dur-base) var(--ease);
}
/* 선택된 분절만 흰 배경으로 떠오른다 */
.tabs button.on {
  background: var(--white); color: var(--text-primary); box-shadow: var(--shadow-1);
}

/* ── 일정 (list-row) ───────────────────────────────── */
.day, .places { padding-top: 0; }
/* h3 22/700 */
.day h2, .places h2 {
  margin: 32px 0 4px; font-size: 1.375rem; line-height: 1.3; letter-spacing: -.015em;
}
.tabs + .day h2 { margin-top: 20px; }

.item { display: flex; gap: 20px; padding: 20px 0; }
.item + .item { border-top: 1px solid var(--line-default); }
/* 시각은 고정폭 숫자로. 실시간 데이터 칼럼과 같은 취급이다 */
.item .time {
  flex: 0 0 3.25rem; padding-top: 2px;
  color: var(--text-secondary); font-size: .9375rem; font-weight: 600;
  font-variant-numeric: tabular-nums; letter-spacing: -.005em;
}
.item .body { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
/* title-1 18/600 */
.item .label { font-size: 1.125rem; font-weight: 600; line-height: 1.45; letter-spacing: -.01em; }
.item .place { margin-top: 2px; color: var(--text-secondary); font-size: .9375rem; }
/* 행 전체가 아니라 장소만 눌리므로 chevron으로 눌린다는 걸 알린다 */
.item .place a { display: inline-flex; align-items: center; min-height: 44px; color: var(--text-primary); font-weight: 500; }

.item .place a:active { color: var(--text-secondary); }
.item .status {
  display: inline-flex; align-items: center; min-height: 22px;
  margin-top: 8px; padding: 2px 8px; border-radius: 6px;
  background: var(--fill-secondary); color: var(--text-secondary);
  font-size: .75rem; font-weight: 500; line-height: 1.4; letter-spacing: 0;
}
.item .status.ok { background: var(--green-washed); color: var(--green-500); }
.item .status.risk { background: var(--orange-washed); color: #b35f00; }
/* body-3 */
.item .note { margin-top: 6px; color: var(--text-secondary); font-size: .8125rem; letter-spacing: 0; }

/* ── 장소 ───────────────────────────────────────────── */
.places { display: grid; grid-template-columns: 1fr; gap: 16px; }
.places h2 { grid-column: 1 / -1; margin-bottom: 6px; }
.place-card {
  padding: 20px; border-radius: var(--r-2xl); background: var(--fill-weak);
  scroll-margin-top: 96px;
}
.place-card:target { box-shadow: 0 0 0 1.5px var(--fill-brand); }
/* h4 20/700 */
.place-card h3 { margin: 0 0 10px; font-size: 1.25rem; line-height: 1.35; letter-spacing: -.015em; }

/* table-row — 라벨/값을 헤어라인으로 가른다 */
.place-card dl { display: grid; grid-template-columns: 4rem 1fr; margin: 0; }
.place-card dt {
  grid-column: 1; padding: 9px 0; color: var(--text-secondary);
  font-size: .8125rem; font-weight: 500; letter-spacing: 0;
}
.place-card dd {
  grid-column: 2; margin: 0; padding: 9px 0;
  font-size: .9375rem; overflow-wrap: anywhere;
}
.place-card dt:not(:first-of-type),
.place-card dd:not(:first-of-type) { border-top: 1px solid var(--grey-200); }
.place-card dd a { display: inline-flex; align-items: center; min-height: 44px; color: var(--text-primary); font-weight: 500; }

/* button-secondary M — 화면에 primary CTA가 없으므로 블루를 쓰지 않는다 */
.map {
  display: inline-flex; align-items: center; min-height: 44px; margin-top: 16px;
  padding: 0 16px; border: 1px solid var(--grey-200); border-radius: var(--r-m);
  background: var(--white); color: var(--text-primary);
  font-size: .9375rem; font-weight: 600; letter-spacing: -.005em;
  transition: background var(--dur-fast) var(--ease);
}
.map:active { background: var(--grey-100); }

.place-card strong, .item .note strong { font-weight: 600; color: var(--text-primary); }
.place-card code, .item code {
  padding: 1px 5px; border-radius: var(--r-xs); background: var(--grey-100);
  font-family: inherit; font-variant-numeric: tabular-nums; font-size: .95em;
}

/* ── 반응형 — 컬럼을 늘리지 않고 여백만 넓힌다 ─────── */
@media (min-width: 641px) {
  :root { --gutter: 24px; }
  .top { padding-top: 64px; padding-bottom: 24px; }
  .top h1 { font-size: 2.5rem; }
  .place-card { padding: 24px; }
}
@media (hover: hover) {
  .plans a:hover, .back:hover, .map:hover, details.past summary:hover { background: var(--fill-secondary); }
  .item .place a:hover, .place-card dd a:hover { text-decoration: underline; }
}
[hidden] { display: none !important; }
@media (max-width: 380px) {
  .item { gap: 10px; }
  .item .time { flex-basis: 3rem; }
  .place-card dl { grid-template-columns: 3.5rem 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* 동선 지도는 요청할 때만 네트워크를 쓴다. 일정은 오프라인에서도 남는다. */
.route { margin: 20px 0; padding: 20px; background: var(--fill-weak); border-radius: var(--r-2xl); }
.route h3 { font-size: 1.125rem; }
.route-note, .route-message { color: var(--text-secondary); font-size: .8125rem; margin: 8px 0 0; }
.route-message:empty { display: none; }
.route-canvas { height: 360px; margin-top: 16px; border-radius: var(--r-m); isolation: isolate; z-index: 0; }
.route .route-marker { display: flex; align-items: center; justify-content: center; background: var(--fill-brand); color: var(--text-alt); border: 1px solid var(--bg-primary); border-radius: var(--r-full); font: 600 13px/1 var(--font); }
.route .leaflet-bar a { width: 44px; height: 44px; line-height: 44px; }
.route .leaflet-popup-content { font-family: var(--font); }
.route-open:disabled { opacity: .3; cursor: wait; }

.icon { width: 20px; height: 20px; flex: 0 0 auto; vertical-align: middle; }
.back, .map, .checked, .status, .item .place a { gap: 6px; }
.checked .icon, .status .icon { width: 14px; height: 14px; }
.item .place .icon { width: 16px; height: 16px; color: var(--text-tertiary); }
</style>
</head>
<body>
<header class="top"><h1>데이트 플랜</h1><p class="range">함께할 하루, 일정과 장소를 한눈에 봐요.</p></header>
<ul class="plans" id="plans">
<li data-start="2026-09-19" data-end="2026-09-19"><a href="2026-09-19-%EC%84%9C%EC%9A%B8/"><span class="checked todo"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>확인 전</span><span class="t">해방촌 토터스와 남산 생일 데이트</span><span class="d">2026년 9월 19일 (토) · 8개 일정</span><span class="plan-arrow"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 5 7 7-7 7"/></svg></span></a></li>

<script>(function () {
  // 정적 사이트라 '오늘'을 빌드 시각으로 굳히면 다음 배포까지 상한다. 볼 때 정한다.
  var now = new Date();
  var today = now.getFullYear() + '-' +
              String(now.getMonth() + 1).padStart(2, '0') + '-' +
              String(now.getDate()).padStart(2, '0');

  var list = document.getElementById('plans');
  if (list) {
    // 오늘 걸린 플랜은 '재생 중'으로 표시한다. 빌드 시각이 아니라 볼 때 정해진다.
    Array.prototype.forEach.call(list.children, function (li) {
      if (li.dataset.start <= today && today <= li.dataset.end) {
        li.classList.add('now');
      }
    });

    var past = Array.prototype.filter.call(list.children, function (li) {
      return li.dataset.end < today;
    });
    if (past.length && past.length < list.children.length) {
      var box = document.createElement('details');
      box.className = 'past';
      var summary = document.createElement('summary');
      summary.textContent = '지난 플랜 ' + past.length + '개';
      var ul = document.createElement('ul');
      ul.className = 'plans';
      past.forEach(function (li) { ul.appendChild(li); });
      box.appendChild(summary);
      box.appendChild(ul);
      list.parentNode.insertBefore(box, list.nextSibling);
    }
  }

  var tabs = document.querySelector('[data-tabs]');
  if (!tabs) { return; }
  var days = Array.prototype.slice.call(document.querySelectorAll('.day'));
  var buttons = Array.prototype.slice.call(tabs.querySelectorAll('button'));

  function show(day) {
    days.forEach(function (s) {
      s.hidden = s.dataset.day !== day;
      s.dispatchEvent(new Event('daychange'));
    });
    buttons.forEach(function (b) {
      b.classList.toggle('on', b.dataset.day === day);
      b.setAttribute('aria-pressed', String(b.dataset.day === day));
    });
  }

  buttons.forEach(function (b) {
    b.addEventListener('click', function () { show(b.dataset.day); });
  });

  // 오늘이 일정 범위 안이면 그 날을 편다. 아니면 첫날.
  var inRange = today >= tabs.dataset.start && today <= tabs.dataset.end;
  var hasToday = buttons.some(function (b) { return b.dataset.day === today; });
  tabs.hidden = false;
  show(inRange && hasToday ? today : buttons[0].dataset.day);
})();

(function () {
  var library;
  function loadLibrary() {
    if (!library) {
      library = Promise.all([
        ['link', 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css', 'sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY='],
        ['script', 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js', 'sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=']
      ].map(function (asset) {
        return new Promise(function (resolve, reject) {
          var node = document.createElement(asset[0]);
          var timer = setTimeout(fail, 12000);
          function fail() { clearTimeout(timer); node.remove(); reject(new Error('map unavailable')); }
          if (asset[0] === 'link') { node.rel = 'stylesheet'; node.href = asset[1]; }
          else { node.src = asset[1]; }
          node.integrity = asset[2]; node.crossOrigin = 'anonymous';
          node.onload = function () { clearTimeout(timer); resolve(); };
          node.onerror = fail;
          document.head.appendChild(node);
        });
      })).catch(function (error) { library = null; throw error; });
    }
    return library;
  }

  document.querySelectorAll('.route-open').forEach(function (button) {
    button.addEventListener('click', async function () {
      var section = button.closest('.route');
      var canvas = section.querySelector('.route-canvas');
      var message = section.querySelector('.route-message');
      var stops = JSON.parse(button.dataset.route);
      var known = stops.filter(function (stop) { return stop.point; });
      if (!known.length) {
        message.textContent = '아직 표시할 위치가 없어요. 아래 장소에서 지도를 열어 주세요.';
        return;
      }
      button.disabled = true;
      message.textContent = '지도를 불러오고 있어요.';
      var map;
      try {
        await loadLibrary();
        canvas.hidden = false;
        map = L.map(canvas, { scrollWheelZoom: false });
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).on('tileerror', function () {
          message.textContent = '배경 지도를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.';
        }).addTo(map);
        var color = getComputedStyle(document.documentElement).getPropertyValue('--fill-brand').trim();
        var previous = null;
        var groups = new Map();
        stops.forEach(function (stop) {
          // 위치가 빠진 구간을 건너 연결하면 실제 순서를 오해할 수 있다.
          if (previous && stop.point) {
            L.polyline([previous, stop.point], { color: color, weight: 3, dashArray: '6 8' }).addTo(map);
          }
          previous = stop.point;
          if (!stop.point) { return; }
          var key = stop.point.join(',');
          if (!groups.has(key)) { groups.set(key, []); }
          groups.get(key).push(stop);
        });
        groups.forEach(function (visits) {
          var numbers = visits.map(function (stop) { return stop.number; }).join('·');
          var popup = document.createElement('div');
          visits.forEach(function (stop) {
            var line = document.createElement('p');
            line.textContent = stop.number + '. ' + stop.time + ' ' + stop.name;
            popup.appendChild(line);
          });
          var source = document.createElement('small');
          source.textContent = '주소 기준 위치 · Kakao Local · ' + visits[0].checked.slice(0, 10) + ' 조회';
          popup.appendChild(source);
          L.marker(visits[0].point, {
            icon: L.divIcon({ className: 'route-marker', html: numbers, iconSize: [44, 44], iconAnchor: [22, 22] }),
            title: visits.map(function (stop) { return stop.number + '. ' + stop.name; }).join(', ')
          }).bindPopup(popup).addTo(map);
        });
        function fit() {
          if (section.closest('.day').hidden) { return; }
          map.invalidateSize();
          map.fitBounds(known.map(function (stop) { return stop.point; }), { padding: [32, 32], maxZoom: 16 });
        }
        fit();
        section.closest('.day').addEventListener('daychange', fit);
        button.hidden = true;
        message.textContent = '번호를 누르면 장소와 시간을 볼 수 있어요.';
      } catch (error) {
        if (map) { map.remove(); }
        canvas.hidden = true;
        message.textContent = '지도를 불러오지 못했어요. 다시 시도하거나 아래 장소의 지도를 열어 주세요.';
      } finally {
        button.disabled = false;
      }
    });
  });
})();
</script>
