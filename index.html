<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
<title>데이트 플랜</title>
<style>:root {
  --bg: #fbfaf8; --fg: #1d1b18; --muted: #6d6862; --line: #e5e0d8;
  --card: #ffffff; --link: #1f5fa8;
  --ok: #1f7a45; --ok-bg: #e4f4ea;
  --todo: #6d6862; --todo-bg: #efece7;
  --risk: #9a5a06; --risk-bg: #fbeeda;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16151a; --fg: #eceaf2; --muted: #a09aa8; --line: #302e38;
    --card: #1f1e25; --link: #8ab6ef;
    --ok: #7fd9a4; --ok-bg: #1a3a28;
    --todo: #a09aa8; --todo-bg: #2a2830;
    --risk: #f0b972; --risk-bg: #3d2c14;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0 auto; max-width: 44rem; padding: 0 16px 64px;
  background: var(--bg); color: var(--fg);
  font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        Pretendard, "Noto Sans KR", system-ui, sans-serif;
  -webkit-text-size-adjust: 100%;
}
a { color: var(--link); }
.top { padding: 24px 0 8px; }
.top h1 { margin: 0 0 4px; font-size: 1.5rem; letter-spacing: -.01em; }
.back { display: inline-block; margin-bottom: 12px; font-size: .875rem; text-decoration: none; }
.range { margin: 0; color: var(--muted); font-size: .9375rem; }
.checked { display: inline-block; margin: 10px 0 0; padding: 3px 9px;
           border-radius: 999px; font-size: .8125rem; }
.checked.ok { background: var(--ok-bg); color: var(--ok); }
.checked.todo { background: var(--todo-bg); color: var(--todo); }
.empty { color: var(--muted); }

.plans { margin: 16px 0 0; padding: 0; list-style: none; }
.plans li { position: relative; margin-bottom: 10px; background: var(--card);
            border: 1px solid var(--line); border-radius: 12px; }
.plans a { display: block; padding: 14px 16px; color: inherit; text-decoration: none; }
.plans .t { display: block; font-weight: 600; padding-right: 4.5rem; }
.plans .d { display: block; margin-top: 2px; color: var(--muted); font-size: .875rem; }
.plans .checked { position: absolute; top: 13px; right: 12px; margin: 0; }
details.past { margin-top: 20px; }
details.past summary { padding: 6px 0; color: var(--muted); font-size: .9375rem; cursor: pointer; }

.tabs { display: flex; gap: 8px; margin: 16px 0 4px; padding-bottom: 4px;
        overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tabs button { flex: 0 0 auto; padding: 7px 14px; border: 1px solid var(--line);
               border-radius: 999px; background: var(--card); color: var(--muted);
               font: inherit; font-size: .875rem; cursor: pointer; }
.tabs button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.day h2, .places h2 { margin: 24px 0 10px; color: var(--muted);
                      font-size: 1rem; font-weight: 600; }

.item { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.item .time { flex: 0 0 3.5rem; padding-top: 1px; font-weight: 600;
              font-size: 1.0625rem; font-variant-numeric: tabular-nums; }
.item .body { flex: 1 1 auto; min-width: 0; }
.item .label { font-weight: 600; }
.item .place { margin-top: 1px; }
.item .place a { text-decoration: none; border-bottom: 1px solid var(--line); }
.item .status { display: inline-block; margin-top: 6px; padding: 2px 8px;
                border-radius: 999px; font-size: .75rem; }
.item .status.ok { background: var(--ok-bg); color: var(--ok); }
.item .status.todo { background: var(--todo-bg); color: var(--todo); }
.item .status.risk { background: var(--risk-bg); color: var(--risk); }
.item .note { margin-top: 6px; color: var(--muted); font-size: .875rem; }

.place-card { margin-bottom: 10px; padding: 14px 16px; background: var(--card);
              border: 1px solid var(--line); border-radius: 12px; scroll-margin-top: 12px; }
.place-card h3 { margin: 0 0 8px; font-size: 1rem; }
.place-card dl { display: grid; grid-template-columns: 4.5rem 1fr; gap: 4px 10px;
                 margin: 0; font-size: .875rem; }
.place-card dt { color: var(--muted); }
.place-card dd { margin: 0; overflow-wrap: anywhere; }
.map { display: inline-block; margin-top: 12px; padding: 8px 14px;
       border: 1px solid var(--line); border-radius: 999px;
       font-size: .875rem; text-decoration: none; }

.place-card strong, .item .note strong { font-weight: 600; color: var(--fg); }
.place-card code, .item code { padding: 1px 4px; border-radius: 4px;
                               background: var(--todo-bg); font-size: .9em; }
</style>
</head>
<body>
<header class="top"><h1>데이트 플랜</h1></header>
<ul class="plans" id="plans">
<li data-start="2026-09-04" data-end="2026-09-06"><a href="2026-09-04-%EC%88%98%EC%9B%90/"><span class="t">수원 2박 3일 — 마라탕·행궁동·광교</span><span class="d">2026년 9월 4일 (금) – 9/6 (일) · 10개 일정</span></a><span class="checked todo">확인 전</span></li>
<li data-start="2026-08-29" data-end="2026-08-30"><a href="2026-08-29-%EC%84%9C%EC%9A%B8/"><span class="t">충무로·종로·익선동 1박 2일</span><span class="d">2026년 8월 29일 (토) – 8/30 (일) · 9개 일정</span></a><span class="checked todo">확인 전</span></li>
<li data-start="2026-08-22" data-end="2026-08-22"><a href="2026-08-22-%EC%84%9C%EC%9A%B8/"><span class="t">압구정 데이트</span><span class="d">2026년 8월 22일 (토) · 6개 일정</span></a></li>
</ul>
<script>(function () {
  // 정적 사이트라 '오늘'을 빌드 시각으로 굳히면 다음 배포까지 상한다. 볼 때 정한다.
  var now = new Date();
  var today = now.getFullYear() + '-' +
              String(now.getMonth() + 1).padStart(2, '0') + '-' +
              String(now.getDate()).padStart(2, '0');

  var list = document.getElementById('plans');
  if (list) {
    var past = Array.prototype.filter.call(list.children, function (li) {
      return li.dataset.end < today;
    });
    if (past.length && past.length < list.children.length) {
      var box = document.createElement('details');
      box.className = 'past';
      var summary = document.createElement('summary');
      summary.textContent = '지난 플랜 ' + past.length + '개';
      var ul = document.createElement('ul');
      ul.className = 'plans';
      past.forEach(function (li) { ul.appendChild(li); });
      box.appendChild(summary);
      box.appendChild(ul);
      list.parentNode.insertBefore(box, list.nextSibling);
    }
  }

  var tabs = document.querySelector('[data-tabs]');
  if (!tabs) { return; }
  var days = Array.prototype.slice.call(document.querySelectorAll('.day'));
  var buttons = Array.prototype.slice.call(tabs.querySelectorAll('button'));

  function show(day) {
    days.forEach(function (s) { s.hidden = s.dataset.day !== day; });
    buttons.forEach(function (b) { b.classList.toggle('on', b.dataset.day === day); });
  }

  buttons.forEach(function (b) {
    b.addEventListener('click', function () { show(b.dataset.day); });
  });

  // 오늘이 일정 범위 안이면 그 날을 편다. 아니면 첫날.
  var inRange = today >= tabs.dataset.start && today <= tabs.dataset.end;
  var hasToday = buttons.some(function (b) { return b.dataset.day === today; });
  tabs.hidden = false;
  show(inRange && hasToday ? today : buttons[0].dataset.day);
})();
</script>
</body>
</html>
